<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test — Weekly Accomplishments Field</title>
  <link rel="stylesheet" href="css/style.css"/>
  <!-- Quill Rich Text Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet"/>
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <style>
    body { padding: 2rem; max-width: 900px; margin: 0 auto; }
    .test-section { margin: 2rem 0; padding: 1.5rem; border: 2px solid #ddd; border-radius: 8px; }
    .test-section h2 { margin-top: 0; color: #333; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    .warn { color: orange; font-weight: bold; }
    .test-box { background: #f5f5f5; padding: 1rem; margin: 1rem 0; border-left: 4px solid #0066cc; }
    button { padding: 0.5rem 1rem; margin: 0.5rem 0; cursor: pointer; }
    #console-output { background: #1e1e1e; color: #00ff00; padding: 1rem; border-radius: 4px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    .ql-container { min-height: 150px; }
  </style>
</head>
<body>

<h1>🧪 Weekly Accomplishments Field Diagnostics</h1>

<!-- TEST 1: DOM Presence -->
<div class="test-section">
  <h2>1. DOM Container Check</h2>
  <div id="test-dom" class="test-box"></div>
  <button onclick="testDOMPresence()">Run Test</button>
</div>

<!-- TEST 2: CSS Visibility -->
<div class="test-section">
  <h2>2. CSS Visibility Check</h2>
  <div id="test-css" class="test-box"></div>
  <button onclick="testCSSVisibility()">Run Test</button>
</div>

<!-- TEST 3: Quill Initialization -->
<div class="test-section">
  <h2>3. Quill Editor Initialization</h2>
  <div id="test-quill" class="test-box"></div>
  <button onclick="testQuillInit()">Run Test</button>
</div>

<!-- TEST 4: Live Editor Test (Add Form) -->
<div class="test-section">
  <h2>4. Live Editor Test (Add Form)</h2>
  <label>Weekly Accomplishments</label>
  <div id="test-editor-add" class="quill-editor"></div>
  <button onclick="testEditorContent('add')">Test Functionality</button>
  <div id="test-editor-add-result" class="test-box"></div>
</div>

<!-- TEST 5: Live Editor Test (Edit Modal) -->
<div class="test-section">
  <h2>5. Live Editor Test (Edit Modal - Hidden Container)</h2>
  <button onclick="toggleEditModal()">Open Test Modal</button>
  <div id="edit-test-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:white; padding:2rem; border-radius:8px; width:90%; max-width:600px; max-height:90vh; overflow-y:auto;">
      <h3>Edit Modal Test</h3>
      <label>Weekly Accomplishments</label>
      <div id="test-editor-edit" class="quill-editor"></div>
      <button onclick="testEditorContent('edit')">Test Content</button>
      <button onclick="toggleEditModal()">Close</button>
      <div id="test-editor-edit-result" class="test-box"></div>
    </div>
  </div>
</div>

<!-- TEST 6: Console Output -->
<div class="test-section">
  <h2>6. Console Log</h2>
  <div id="console-output"></div>
</div>

<script src="js/quill-config.js"></script>
<script>
  // Setup for Quill CSS
  const style = document.createElement('style');
  style.textContent = `
    .quill-editor {
      display: block;
      visibility: visible;
      width: 100%;
    }
    #test-editor-add,
    #test-editor-edit {
      display: block !important;
      visibility: visible !important;
      width: 100% !important;
    }
    .ql-container {
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      display: block !important;
      visibility: visible !important;
    }
    .ql-toolbar {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      background: var(--bg-subtle);
      padding: 0.5rem 0.6rem;
    }
    .ql-container.ql-snow {
      border: 1.5px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    }
    .ql-editor {
      min-height: 150px;
      padding: 0.75rem 0.9rem;
      line-height: 1.65;
      color: var(--text);
      display: block !important;
      visibility: visible !important;
    }
  `;
  document.head.appendChild(style);

  const consoleEl = document.getElementById('console-output');
  const originalLog = console.log;
  console.log = function(...args) {
    originalLog.apply(console, args);
    const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
    consoleEl.innerHTML += msg + '<br>';
    consoleEl.scrollTop = consoleEl.scrollHeight;
  };

  function log(msg) {
    console.log(msg);
  }

  function testDOMPresence() {
    log('🔍 Testing DOM Presence...');
    const addEditor = document.getElementById('test-editor-add');
    const editEditor = document.getElementById('test-editor-edit');
    
    const result = document.getElementById('test-dom');
    if (addEditor && editEditor) {
      result.innerHTML = '<span class="pass">✓ PASS:</span> Both editor containers found in DOM';
      log('✓ Add form editor: ' + addEditor.id);
      log('✓ Edit modal editor: ' + editEditor.id);
    } else {
      result.innerHTML = '<span class="fail">✗ FAIL:</span> One or both editor containers missing';
      log('✗ Add editor found: ' + !!addEditor);
      log('✗ Edit editor found: ' + !!editEditor);
    }
  }

  function testCSSVisibility() {
    log('🔍 Testing CSS Visibility...');
    const addEditor = document.getElementById('test-editor-add');
    const editEditor = document.getElementById('test-editor-edit');
    
    const result = document.getElementById('test-css');
    const checkDisplay = (el) => {
      const style = window.getComputedStyle(el);
      return {
        display: style.display,
        visibility: style.visibility,
        width: style.width,
        height: el.offsetHeight
      };
    };
    
    const addStyles = checkDisplay(addEditor);
    const editStyles = checkDisplay(editEditor);
    
    log('Add Editor Styles:', addStyles);
    log('Edit Editor Styles:', editStyles);
    
    let html = '<strong>Add Form Editor:</strong><br>';
    html += `Display: ${addStyles.display}, Visibility: ${addStyles.visibility}, Height: ${addStyles.height}px<br>`;
    html += '<strong>Edit Modal Editor:</strong><br>';
    html += `Display: ${editStyles.display}, Visibility: ${editStyles.visibility}, Height: ${editStyles.height}px<br>`;
    
    if (addStyles.display !== 'none' && addStyles.visibility === 'visible') {
      html += '<span class="pass">✓ PASS: Add editor visible</span>';
    } else {
      html += '<span class="fail">✗ FAIL: Add editor not visible</span>';
    }
    
    result.innerHTML = html;
  }

  function testQuillInit() {
    log('🔍 Testing Quill Initialization...');
    const result = document.getElementById('test-quill');
    
    // Initialize test editors if not already done
    if (!window.testEditorsInit) {
      try {
        if (!quillEditors.testAdd) {
          quillEditors.testAdd = new Quill('#test-editor-add', {
            theme: 'snow',
            modules: {
              toolbar: [
                ['bold', 'italic', 'underline'],
                [{ 'align': ['', 'center', 'right', 'justify'] }],
                [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                [{ 'header': [1, 2, 3, false] }],
                [{ 'size': ['8px', '10px', '12px', '14px', '16px', '18px', '20px', '22px', '24px'] }],
                ['clean']
              ]
            },
            placeholder: 'Test editor...'
          });
          log('✓ Created Add form editor');
        }
        
        if (!quillEditors.testEdit) {
          quillEditors.testEdit = new Quill('#test-editor-edit', {
            theme: 'snow',
            modules: {
              toolbar: [
                ['bold', 'italic', 'underline'],
                [{ 'align': ['', 'center', 'right', 'justify'] }],
                [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                [{ 'header': [1, 2, 3, false] }],
                [{ 'size': ['8px', '10px', '12px', '14px', '16px', '18px', '20px', '22px', '24px'] }],
                ['clean']
              ]
            },
            placeholder: 'Test editor (modal)...'
          });
          log('✓ Created Edit modal editor');
        }
        
        window.testEditorsInit = true;
        result.innerHTML = '<span class="pass">✓ PASS:</span> Both Quill editors initialized successfully';
      } catch (e) {
        log('✗ Error: ' + e.message);
        result.innerHTML = '<span class="fail">✗ FAIL:</span> ' + e.message;
      }
    } else {
      result.innerHTML = '<span class="pass">✓ PASS:</span> Editors already initialized';
    }
  }

  function testEditorContent(key) {
    log(`🔍 Testing Editor Content (${key})...`);
    const editorKey = 'test' + (key === 'add' ? 'Add' : 'Edit');
    const resultId = 'test-editor-' + key + '-result';
    const result = document.getElementById(resultId);
    
    const editor = quillEditors[editorKey];
    if (!editor) {
      log('✗ Editor not initialized');
      result.innerHTML = '<span class="fail">✗ FAIL:</span> Editor not initialized';
      return;
    }
    
    // Set test content
    const testDelta = {
      ops: [
        { insert: 'Test Content' },
        { insert: '\n', attributes: { header: 1 } },
        { insert: 'This is a test with ' },
        { insert: 'bold', attributes: { bold: true } },
        { insert: ' and ' },
        { insert: 'italic', attributes: { italic: true } },
        { insert: ' formatting.\n' }
      ]
    };
    
    try {
      editor.setContents(testDelta);
      const content = editor.getContents();
      log('✓ Content set successfully');
      log('Content:', content);
      result.innerHTML = `
        <span class="pass">✓ PASS:</span> Editor content test successful<br>
        <strong>Set Delta:</strong> ${JSON.stringify(testDelta)}<br>
        <strong>Retrieved Delta:</strong> ${JSON.stringify(content)}
      `;
    } catch (e) {
      log('✗ Error: ' + e.message);
      result.innerHTML = '<span class="fail">✗ FAIL:</span> ' + e.message;
    }
  }

  function toggleEditModal() {
    const modal = document.getElementById('edit-test-modal');
    if (modal.style.display === 'none') {
      modal.style.display = 'flex';
      log('📋 Edit modal opened');
      // Initialize if needed
      setTimeout(() => {
        if (quillEditors.testEdit) {
          refreshEditorDisplay('testEdit');
        }
      }, 100);
    } else {
      modal.style.display = 'none';
      log('📋 Edit modal closed');
    }
  }

  // Run initial tests on load
  document.addEventListener('DOMContentLoaded', () => {
    log('🚀 Test suite loaded');
    setTimeout(() => {
      testDOMPresence();
      testCSSVisibility();
      testQuillInit();
    }, 500);
  });
</script>

</body>
</html>
